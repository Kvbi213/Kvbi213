  <script>
    const container = document.getElementById('preview');
    // Try to fetch first (works when served via http), fallback to embedded text if file:// fails
    fetch('README.md')
      .then(response => {
        if (!response.ok) throw new Error('Network response not ok');
        return response.text();
      })
      .then(text => {
        container.innerHTML = marked.parse(text);
      })
      .catch(err => {
        const embedded = document.getElementById('embedded-readme').textContent;
        container.innerHTML = marked.parse(embedded);
      });
